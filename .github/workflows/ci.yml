name: CI

on:
  push:
    branches: [main]
  # Every pull request, including ones stacked on another feature branch.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # New backend (backend/) - spec 21.3
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (build, unit + integration tests, ArchUnit, migration safety)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # verify = enforcer (no Lombok, no H2) + unit tests (incl. ArchitectureTest and
      # MigrationSafetyTest) + Testcontainers integration tests on PostgreSQL 16.
      # Docker is available on ubuntu-latest, which Testcontainers needs.
      - name: Build and test
        working-directory: backend
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/site/jacoco/
          if-no-files-found: ignore

      # The API contract, exported by ApplicationBootIT. From Phase 1 a diff against
      # the base branch's copy flags breaking changes.
      - name: Upload OpenAPI document
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/target/openapi/openapi.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # New frontend (frontend/) - spec 18, 20.1
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (lint, type-check, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      # Includes i18n key parity (EN = RW) and WCAG AA contrast of the design tokens.
      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  frontend-e2e:
    name: Frontend end-to-end smoke (Playwright, mobile)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    env:
      E2E_COMPOSE_PROJECT: ikimina-e2e
      E2E_COMPOSE_FILE: ${{ github.workspace }}/backend/compose.yaml
      E2E_COMPOSE_ENV_FILE: ${{ github.workspace }}/e2e.env
    steps:
      - uses: actions/checkout@v7

      # Throwaway secrets for a database that lives only for this job.
      - name: Generate stack configuration
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
            echo "IKIMINA_DB_OWNER_PASSWORD=$(openssl rand -hex 32)"
            echo "IKIMINA_DB_APP_PASSWORD=$(openssl rand -hex 32)"
            echo "IKIMINA_JWT_SECRET=$(openssl rand -hex 32)"
            echo "IKIMINA_OTP_PEPPER=$(openssl rand -hex 32)"
            echo "SPRING_PROFILES_ACTIVE=dev"
            echo "IKIMINA_BACKEND_PORT=18082"
            echo "IKIMINA_DB_HOST_PORT=15432"
            echo "IKIMINA_CORS_ORIGINS=http://localhost:4173"
            echo "IKIMINA_WEB_BASE_URL=http://localhost:4173"
          } > "$E2E_COMPOSE_ENV_FILE"

      - name: Start backend and database
        run: docker compose -p "$E2E_COMPOSE_PROJECT" -f "$E2E_COMPOSE_FILE" --env-file "$E2E_COMPOSE_ENV_FILE" up -d --build --wait

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Serve frontend
        working-directory: frontend
        env:
          IKIMINA_API_URL: http://localhost:18082
        run: |
          nohup npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && exit 0; sleep 1; done
          cat preview.log; exit 1

      - name: Playwright smoke
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

      - name: Backend log on failure
        if: failure()
        run: docker compose -p "$E2E_COMPOSE_PROJECT" -f "$E2E_COMPOSE_FILE" --env-file "$E2E_COMPOSE_ENV_FILE" logs backend | tail -200

  migrations-append-only:
    name: Migrations are append-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Existing migrations unchanged
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="origin/$PR_BASE"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$PUSH_BEFORE"
          else
            echo "No base revision to compare against (first push); nothing to check."
            exit 0
          fi
          sh backend/scripts/check-migrations-append-only.sh "$base"

  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Run from the official image rather than gitleaks-action, which needs a licence
      # key for organisation-owned repositories. Reviewed exceptions: .gitleaksignore.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --gitleaks-ignore-path /repo/.gitleaksignore

  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Scan dependencies for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          # Report-only while the legacy tree is still here; flip to '1' once its backlog is cleared.
          exit-code: '0'
          format: sarif
          output: trivy-results.sarif

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ---------------------------------------------------------------------------
  # Legacy application (ikimina/, frontend-ikimina/) - frozen, see
  # docs/adr/0001-legacy-code.md. Kept green until it is retired.
  # ---------------------------------------------------------------------------
  legacy-backend:
    name: Legacy backend (build, test, migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ikimina_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and test
        working-directory: ikimina
        run: ./mvnw -B verify

      - name: Apply migrations to a real PostgreSQL
        working-directory: ikimina
        run: |
          ./mvnw -B -q flyway:migrate \
            -Dflyway.url=jdbc:postgresql://localhost:5432/ikimina_ci \
            -Dflyway.user=postgres \
            -Dflyway.password=ci-postgres-password \
            -Dflyway.locations=filesystem:src/main/resources/db/migration \
            -Dflyway.baselineOnMigrate=true

      - name: Verify migrations are idempotent
        working-directory: ikimina
        run: |
          ./mvnw -B -q flyway:migrate \
            -Dflyway.url=jdbc:postgresql://localhost:5432/ikimina_ci \
            -Dflyway.user=postgres \
            -Dflyway.password=ci-postgres-password \
            -Dflyway.locations=filesystem:src/main/resources/db/migration \
            -Dflyway.baselineOnMigrate=true

      - name: Verify entities match the migrated schema
        working-directory: ikimina
        env:
          IKIMINA_DB_NAME: ikimina_ci
          IKIMINA_DB_PASSWORD: ci-postgres-password
          IKIMINA_JWT_SECRET: ci-only-signing-key-32-bytes-minimum-length-value
          IKIMINA_JPA_DDL_AUTO: validate
          SPRING_FLYWAY_ENABLED: 'false'
        run: |
          ./mvnw -B -q spring-boot:start
          ./mvnw -B -q spring-boot:stop

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-jacoco-report
          path: ikimina/target/site/jacoco/
          if-no-files-found: ignore

  legacy-frontend:
    name: Legacy frontend (lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-ikimina/package-lock.json

      - name: Install
        working-directory: frontend-ikimina
        run: npm ci

      - name: Lint
        working-directory: frontend-ikimina
        run: npm run lint

      - name: Build
        working-directory: frontend-ikimina
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, legacy-backend, legacy-frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build legacy backend image
        uses: docker/build-push-action@v6
        with:
          context: ./ikimina
          push: false
          cache-from: type=gha,scope=legacy-backend
          cache-to: type=gha,mode=max,scope=legacy-backend

      - name: Build legacy frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-ikimina
          push: false
          cache-from: type=gha,scope=legacy-frontend
          cache-to: type=gha,mode=max,scope=legacy-frontend
