name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build, test, migrations)
    runs-on: ubuntu-latest
    services:
      # The migrations are PostgreSQL-specific (plpgsql triggers, DO blocks,
      # information_schema probes), so they are verified against real
      # PostgreSQL rather than an in-memory substitute.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ikimina_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        working-directory: ikimina
        run: ./mvnw -B verify

      - name: Apply migrations to a real PostgreSQL
        working-directory: ikimina
        env:
          IKIMINA_DB_NAME: ikimina_ci
          IKIMINA_DB_PASSWORD: ci-postgres-password
          IKIMINA_JWT_SECRET: ci-only-signing-key-32-bytes-minimum-length-value
        run: |
          ./mvnw -B -q flyway:migrate \
            -Dflyway.url=jdbc:postgresql://localhost:5432/ikimina_ci \
            -Dflyway.user=postgres \
            -Dflyway.password=ci-postgres-password \
            -Dflyway.locations=filesystem:src/main/resources/db/migration \
            -Dflyway.baselineOnMigrate=true

      - name: Verify migrations are idempotent
        working-directory: ikimina
        run: |
          ./mvnw -B -q flyway:migrate \
            -Dflyway.url=jdbc:postgresql://localhost:5432/ikimina_ci \
            -Dflyway.user=postgres \
            -Dflyway.password=ci-postgres-password \
            -Dflyway.locations=filesystem:src/main/resources/db/migration \
            -Dflyway.baselineOnMigrate=true

      - name: Verify entities match the migrated schema
        # ddl-auto=validate fails the boot if any mapping disagrees with the
        # schema Flyway produced. This is the check that keeps the two in step.
        working-directory: ikimina
        env:
          IKIMINA_DB_NAME: ikimina_ci
          IKIMINA_DB_PASSWORD: ci-postgres-password
          IKIMINA_JWT_SECRET: ci-only-signing-key-32-bytes-minimum-length-value
          IKIMINA_JPA_DDL_AUTO: validate
          SPRING_FLYWAY_ENABLED: 'false'
        run: |
          ./mvnw -B -q spring-boot:start
          ./mvnw -B -q spring-boot:stop

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: ikimina/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-ikimina/package-lock.json

      - name: Install
        working-directory: frontend-ikimina
        run: npm ci

      - name: Lint
        working-directory: frontend-ikimina
        run: npm run lint

      - name: Build
        working-directory: frontend-ikimina
        run: npm run build

  dependency-scan:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan past commits, not just the tip.
          fetch-depth: 0

      - name: Scan dependencies for known vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          # Report rather than block at first, so the backlog is visible before
          # it starts failing every PR. Flip to '1' once the queue is clear.
          exit-code: '0'
          format: sarif
          output: trivy-results.sarif

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./ikimina
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-ikimina
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max