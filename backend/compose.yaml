# Local stack for the new backend (spec 21.1).
#
#   cd backend
#   cp .env.example .env      # fill in the passwords
#   docker compose up --build                    # postgres + backend
#   docker compose --profile tools up --build    # + Mailpit and Redis
#
# The database is initialised on first start with the owner/app role split from
# docker/postgres/sql/roles.sql - the same script the integration tests use.
# To re-initialise: docker compose down -v (destroys the local volume).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${IKIMINA_DB_NAME:-ikimina}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in backend/.env}
      IKIMINA_DB_OWNER_PASSWORD: ${IKIMINA_DB_OWNER_PASSWORD:?IKIMINA_DB_OWNER_PASSWORD must be set in backend/.env}
      IKIMINA_DB_APP_PASSWORD: ${IKIMINA_DB_APP_PASSWORD:?IKIMINA_DB_APP_PASSWORD must be set in backend/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/sql:/opt/ikimina/sql:ro
    # Published on loopback only, for local tools (psql, IDE). Not reachable from the network.
    ports:
      - "127.0.0.1:${IKIMINA_DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${IKIMINA_DB_NAME:-ikimina}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      IKIMINA_DB_HOST: db
      IKIMINA_DB_PORT: "5432"
      IKIMINA_DB_NAME: ${IKIMINA_DB_NAME:-ikimina}
      IKIMINA_DB_OWNER_USERNAME: ${IKIMINA_DB_OWNER_USERNAME:-ikimina_owner}
      IKIMINA_DB_OWNER_PASSWORD: ${IKIMINA_DB_OWNER_PASSWORD}
      IKIMINA_DB_APP_USERNAME: ${IKIMINA_DB_APP_USERNAME:-ikimina_app}
      IKIMINA_DB_APP_PASSWORD: ${IKIMINA_DB_APP_PASSWORD}
      IKIMINA_JWT_SECRET: ${IKIMINA_JWT_SECRET:?IKIMINA_JWT_SECRET must be set in backend/.env}
      IKIMINA_OTP_PEPPER: ${IKIMINA_OTP_PEPPER:?IKIMINA_OTP_PEPPER must be set in backend/.env}
      IKIMINA_SMS_PROVIDER: ${IKIMINA_SMS_PROVIDER:-fake}
      IKIMINA_CORS_ORIGINS: ${IKIMINA_CORS_ORIGINS:-http://localhost:5173}
      IKIMINA_WEB_BASE_URL: ${IKIMINA_WEB_BASE_URL:-http://localhost:5173}
      IKIMINA_DEV_PLATFORM_ADMIN_PASSWORD: ${IKIMINA_DEV_PLATFORM_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${IKIMINA_BACKEND_PORT:-8082}:8082"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # Optional dev tools (spec 21.1). Mailpit is the maintained successor of MailHog,
  # with the same SMTP (1025) and web UI (8025) ports.
  mail:
    image: axllent/mailpit:v1.31
    profiles: [tools]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # Optional (spec 4.1): rate-limit counters and OTP storage. Never required for financial correctness.
  redis:
    image: redis:7-alpine
    profiles: [tools]
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  db-data:
