# Local development. Activate with SPRING_PROFILES_ACTIVE=dev. Never for shared environments.

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    rw.ikimina: DEBUG
    org.springframework.security: DEBUG

ikimina:
  auth:
    refresh-cookie-secure: false    # local http
  sms:
    provider: fake
    fake:
      log-messages: true            # dev only: one-time codes appear in the log
  cors:
    allowed-origins: http://localhost:5173
  dev:
    platform-admin:
      password: ${IKIMINA_DEV_PLATFORM_ADMIN_PASSWORD:}
