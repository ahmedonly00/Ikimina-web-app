error.otp_expired.detail=The code has expired. Request a new code.
error.password_too_weak.title=Password too weak
error.password_too_weak.detail=Use at least 8 characters, and avoid common passwords and your phone number.
error.terms_not_accepted.title=Terms not accepted
error.terms_not_accepted.detail=You need to accept the terms and privacy policy to create an account.
