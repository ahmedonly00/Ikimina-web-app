error.reauthentication_required.detail=For your security, enter your password again to continue.
error.csrf_check_failed.title=Request blocked
error.csrf_check_failed.detail=This request did not come from the Ikimina app.
error.concurrent_modification.title=Changed by someone else
error.concurrent_modification.detail=Someone else changed this at the same time. Reload and try again.

# Phase 1: groups
error.invitation_invalid.title=Invitation not valid
error.invitation_invalid.detail=This invitation has expired, was cancelled, was already used, or is for a different phone number.
error.already_member.title=Already a member
error.already_member.detail=This person is already a member of the group.
error.office_occupied.title=Office already held
error.office_occupied.detail=Someone already holds this office. Use a transfer of office instead.
error.office_transfer_required.title=Transfer of office needed
error.office_transfer_required.detail=This member holds an office. Transfer the office to someone else first.
error.self_modification_forbidden.title=Not allowed on yourself
error.self_modification_forbidden.detail=You cannot change your own role or status.
error.settings_change_stale.title=Settings changed meanwhile
error.settings_change_stale.detail=The group settings changed after this proposal was made. Make a new proposal.

