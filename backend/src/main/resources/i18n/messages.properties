# Phase 1: identity
error.invalid_phone_number.title=Invalid phone number
error.invalid_phone_number.detail=Enter a Rwandan mobile number, for example 0788 123 456.
error.invalid_credentials.title=Sign-in failed
error.invalid_credentials.detail=The phone number or password is incorrect, or the account is temporarily locked.
error.invalid_refresh_token.title=Session expired
error.invalid_refresh_token.detail=Your session has ended. Please sign in again.
error.otp_invalid.title=Incorrect code
error.otp_invalid.detail=The code is not correct or can no longer be used. Request a new code.
