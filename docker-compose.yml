# Local and small-deployment stack: database, backend, frontend.
#
# Secrets come from a .env file next to this one (see .env.example). Nothing
# secret is written here, because this file is committed.
#
#   cp .env.example .env    # then fill in the values
#   docker compose up --build

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${IKIMINA_DB_NAME:-ikimina_db}
      POSTGRES_USER: ${IKIMINA_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${IKIMINA_DB_PASSWORD:?IKIMINA_DB_PASSWORD must be set}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Not published to the host by default: the database should only be
    # reachable from the application network.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IKIMINA_DB_USERNAME:-postgres} -d ${IKIMINA_DB_NAME:-ikimina_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [ikimina]

  backend:
    build:
      context: ./ikimina
    restart: unless-stopped
    # Waits for the database to be genuinely accepting connections, not merely
    # started, so Flyway does not fail on first boot.
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      IKIMINA_DB_HOST: db
      IKIMINA_DB_PORT: "5432"
      IKIMINA_DB_NAME: ${IKIMINA_DB_NAME:-ikimina_db}
      IKIMINA_DB_USERNAME: ${IKIMINA_DB_USERNAME:-postgres}
      IKIMINA_DB_PASSWORD: ${IKIMINA_DB_PASSWORD:?IKIMINA_DB_PASSWORD must be set}
      IKIMINA_JWT_SECRET: ${IKIMINA_JWT_SECRET:?IKIMINA_JWT_SECRET must be set - openssl rand -hex 32}
      IKIMINA_JWT_EXPIRATION: ${IKIMINA_JWT_EXPIRATION:-86400000}
      IKIMINA_SUPERADMIN_EMAIL: ${IKIMINA_SUPERADMIN_EMAIL:-superadmin@ikimina.com}
      IKIMINA_SUPERADMIN_PASSWORD: ${IKIMINA_SUPERADMIN_PASSWORD:-}
      IKIMINA_CORS_ORIGINS: ${IKIMINA_CORS_ORIGINS:-http://localhost:8080}
      IKIMINA_SERVER_PORT: "8082"
    expose:
      - "8082"
    # Defence in depth: the app never needs to write to its own filesystem.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks: [ikimina]

  frontend:
    build:
      context: ./frontend-ikimina
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${IKIMINA_HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    networks: [ikimina]

volumes:
  db-data:

networks:
  ikimina:
    driver: bridge