# Serves the built SPA and proxies /api to the backend.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app is a bundle of hashed assets plus one entry document. Hashed
    # assets are immutable; index.html must never be cached or users get
    # stranded on a stale bundle after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Client-side routing: unknown paths are app routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass the correlation id through so a request can be traced end to end.
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
    }

    # Actuator is not exposed publicly; operators reach it inside the network.
    location /actuator/ {
        return 404;
    }

    # Baseline hardening. A real deployment terminates TLS in front of this and
    # should add HSTS there.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 2m;
}