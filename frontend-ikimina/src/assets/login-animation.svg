<svg width="500" height="400" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="250" cy="200" r="150" fill="#4F46E5" fill-opacity="0.1"/>
  
  <!-- Shield icon -->
  <path d="M250 50L200 100V150C200 250 250 300 250 300C250 300 300 250 300 150V100L250 50Z" fill="white" stroke="#4F46E5" stroke-width="10"/>
  <path d="M250 200V150" stroke="#4F46E5" stroke-width="10" stroke-linecap="round"/>
  <circle cx="250" cy="220" r="10" fill="#4F46E5"/>
  
  <!-- Graph elements -->
  <path d="M100 200H150V250H100V200Z" fill="white" stroke="#4F46E5" stroke-width="2"/>
  <path d="M150 180H200V250H150V180Z" fill="white" stroke="#4F46E5" stroke-width="2"/>
  <path d="M200 220H250V250H200V220Z" fill="white" stroke="#4F46E5" stroke-width="2"/>
  <path d="M250 160H300V250H250V160Z" fill="white" stroke="#4F46E5" stroke-width="2"/>
  <path d="M300 200H350V250H300V200Z" fill="white" stroke="#4F46E5" stroke-width="2"/>
  
  <!-- Animation elements -->
  <circle cx="100" cy="100" r="10" fill="white" fill-opacity="0.7">
    <animate attributeName="r" values="5;8;5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="80" r="8" fill="white" fill-opacity="0.7">
    <animate attributeName="r" values="8;12;8" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="300" r="6" fill="white" fill-opacity="0.7">
    <animate attributeName="r" values="6;10;6" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="420" cy="320" r="7" fill="white" fill-opacity="0.7">
    <animate attributeName="r" values="7;11;7" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>
