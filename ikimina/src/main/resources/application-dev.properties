# Development profile: verbose, convenient, unsafe for anything shared.
# Activate with SPRING_PROFILES_ACTIVE=dev

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=INFO
logging.level.com.example.ikimina=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Swagger UI is served only outside production.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Everything is exposed locally to make debugging easy.
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always