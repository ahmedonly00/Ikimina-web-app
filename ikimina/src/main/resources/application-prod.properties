# Production profile. Activate with SPRING_PROFILES_ACTIVE=prod
#
# Everything here is a deliberate tightening over the defaults; none of it
# should be relaxed without a reason recorded in the change.

# The schema is owned by Flyway. Hibernate verifies and never alters.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# SQL logging at INFO would put member financial data in the log stream.
logging.level.root=WARN
logging.level.com.example.ikimina=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# No interactive API browser in production.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Never leak internals to API clients.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Behind a reverse proxy: trust forwarded headers so redirects and the audit
# trail record the client's scheme and address rather than the proxy's.
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Connection pool sized for a small deployment; raise with measured evidence.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.leak-detection-threshold=30000

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized