spring.application.name=ikimina

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ikimina_db
spring.datasource.username=postgres
spring.datasource.password=REDACTED
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=8082

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=REDACTED
spring.security.user.roles=ADMIN

# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.com.example.ikimina=DEBUG

# JWT Configuration
jwt.secret=REDACTED-ROTATED-SECRET
jwt.expiration=86400000
