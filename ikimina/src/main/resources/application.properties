spring.application.name=ikimina

# ---------------------------------------------------------------------------
# Configuration is supplied by the environment. Nothing secret belongs in this
# file - it is committed to source control.
#
# Required environment variables (see .env.example):
#   IKIMINA_DB_PASSWORD   - PostgreSQL password
#   IKIMINA_JWT_SECRET    - HMAC signing key, >= 32 bytes of random data
# ---------------------------------------------------------------------------

# Database Configuration
spring.datasource.url=jdbc:postgresql://${IKIMINA_DB_HOST:localhost}:${IKIMINA_DB_PORT:5432}/${IKIMINA_DB_NAME:ikimina_db}
spring.datasource.username=${IKIMINA_DB_USERNAME:postgres}
spring.datasource.password=${IKIMINA_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
# Flyway owns the schema (V1__init.sql is the baseline, generated from these
# entities). Hibernate only verifies that the schema matches the mappings and
# must never alter it - `update` would let it silently change production tables.
spring.jpa.hibernate.ddl-auto=${IKIMINA_JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${IKIMINA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# An existing (pre-Flyway) database baselines at v1, so V1__init.sql is skipped
# there and V2..V6 carry it forward.
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# Server Configuration
server.port=${IKIMINA_SERVER_PORT:8082}
# Do not leak stack traces or internal messages to API clients.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Logging Configuration
logging.level.root=${IKIMINA_LOG_LEVEL_ROOT:INFO}
logging.level.org.springframework.security=${IKIMINA_LOG_LEVEL_SECURITY:INFO}
logging.level.com.example.ikimina=${IKIMINA_LOG_LEVEL_APP:INFO}

# CORS - comma-separated list of allowed browser origins
ikimina.cors.allowed-origins=${IKIMINA_CORS_ORIGINS:http://localhost:3000,http://localhost:3001}

# JWT Configuration
jwt.secret=${IKIMINA_JWT_SECRET}
jwt.expiration=${IKIMINA_JWT_EXPIRATION:86400000}

# Bootstrap super admin. If IKIMINA_SUPERADMIN_PASSWORD is unset a random
# password is generated on first boot and printed once to the log.
ikimina.superadmin.email=${IKIMINA_SUPERADMIN_EMAIL:superadmin@ikimina.com}
ikimina.superadmin.password=${IKIMINA_SUPERADMIN_PASSWORD:}

# ---------------------------------------------------------------------------
# Actuator. Only health and info are public-ish; everything else needs a
# super-admin token (see SecurityConfig). Health details and components are
# hidden from anonymous callers so the endpoint cannot be used to probe
# infrastructure.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.info.env.enabled=false
management.observations.annotations.enabled=true
# Distinguishes metrics per environment in a shared Prometheus.
management.metrics.tags.application=${spring.application.name}

# Correlate log lines with a request. Populated by RequestIdFilter.
logging.pattern.correlation=[${spring.application.name},%X{requestId:-}]

# ---------------------------------------------------------------------------
# Pagination. Collection endpoints previously returned every row: /api/super-admin/users
# serialised the entire user table and the audit log was unbounded, both of
# which fall over on a real dataset. max-page-size caps what a caller can ask
# for, so a client cannot request the whole table with ?size=1000000.
# ---------------------------------------------------------------------------
spring.data.web.pageable.default-page-size=25
spring.data.web.pageable.max-page-size=200
spring.data.web.pageable.one-indexed-parameters=false
