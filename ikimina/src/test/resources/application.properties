# Test configuration.
#
# The main application.properties deliberately requires IKIMINA_DB_PASSWORD and
# IKIMINA_JWT_SECRET from the environment, so tests must supply their own values
# or the context cannot start.
#
# The context-load smoke test runs against in-memory H2 with Hibernate creating
# the schema. Flyway is disabled here because the migrations are PostgreSQL
# specific (DO blocks, plpgsql triggers, information_schema probes) and are
# verified against real PostgreSQL instead - see docs/DATABASE.md.

spring.datasource.url=jdbc:h2:mem:ikimina;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Any 32+ byte value; this key signs nothing outside the test JVM.
jwt.secret=test-only-signing-key-not-used-anywhere-else-0123456789
jwt.expiration=3600000

ikimina.cors.allowed-origins=http://localhost:3000
ikimina.superadmin.email=superadmin@test.local
ikimina.superadmin.password=test-only-password

logging.level.root=WARN
logging.level.com.example.ikimina=INFO